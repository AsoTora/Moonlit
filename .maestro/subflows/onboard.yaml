appId: com.moonlit
---
- runFlow:
    file: fresh-launch.yaml
    env:
      MODE: "${typeof MODE == 'undefined' ? 'normal' : MODE}"
      HIDE: ''
- extendedWaitUntil:
    visible: Continue
    timeout: 120000
- repeat:
    while:
      visible: Continue
    times: 15
    commands:
      - tapOn:
          text: Continue
          waitToSettleTimeoutMs: 1000
      - waitForAnimationToEnd:
          timeout: 2000
